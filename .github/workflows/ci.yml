name: CI

on:
  # pull_request is what gives a fork's PR any CI at all: a fork push raises no event here, so
  # without it nothing outside this repository is ever built. Limiting push to main then keeps a
  # same-repo PR from building the same commit twice; branches get their run through their PR.
  # tags is separate from branches: a version tag (v*) is what triggers the package job below, and
  # it can point at a commit already built on main, so it must not be folded into the branches list.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to the same branch or pull request cancels the run still going for the old one.
# github.ref is the merge ref (refs/pull/N/merge) on pull_request and the branch elsewhere, so key
# on the PR number when there is one to keep one group per PR across its pushes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A read-only token for every job. The package job pinned this first, with its reasoning below; the
# test job runs on every pull request and inherited whatever the repository default happened to be.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Loadstone.slnx

      - name: Build
        run: dotnet build Loadstone.slnx -c Release --no-restore

      # Real-window tests run here too: the hosted Windows runner has an interactive desktop.
      # .NET 10 SDK's "dotnet test" runs Microsoft.Testing.Platform projects (xunit.v3) natively,
      # opted into via global.json; that mode takes the solution via --solution rather than as a
      # positional argument, and TRX output via --report-trx (Microsoft.Testing.Extensions.TrxReport)
      # rather than the VSTest-only --logger. See https://aka.ms/dotnet-test-mtp-error.
      - name: Test
        run: dotnet test --solution Loadstone.slnx -c Release --no-build --report-trx --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # Runs only on a version tag, and only once test has passed on that same commit - a tag never
  # publishes a package whose tests were red. github.ref for a tag push is refs/tags/vX.Y.Z, which
  # is a distinct concurrency group from any branch ref, so this never cross-cancels a main run.
  package:
    name: Build the Store package
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    # No step here pushes, releases, or otherwise writes to the repo - restore, pack, and upload-artifact
    # all use the runner's artifact service, not the contents API - so this needs no more than the
    # default read-only token. Pinned explicitly anyway so a future release step has to ask for write
    # access itself rather than inherit it unnoticed.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Loadstone.slnx

      # Unsigned on purpose: the Store re-signs MSIX packages with a Microsoft certificate after
      # certification, and signing with a certificate whose subject is not byte-identical to the
      # Partner Center publisher fails upload validation.
      - name: Package
        run: pwsh -File build/build-msix.ps1

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: msix
          path: installer-output/*.msix
          retention-days: 30
          # upload-artifact's own default is to warn and keep the step green when the glob matches
          # nothing; this job runs unattended on a tag, so a run that ends up with no package to
          # publish must fail loudly rather than leave a green run with a missing artifact.
          if-no-files-found: error
